<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de chaves — Fine Gestor</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#14182b;--mut:#667;--bd:#d9deea;--pri:#2456d6}
@media (prefers-color-scheme:dark){:root{--bg:#0b1130;--card:#141b3d;--tx:#eef1fb;--mut:#9aa4c7;--bd:#2a3466}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:20px}
.w{max-width:560px;margin:0 auto}.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:4px 0 12px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
button{padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.k{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.k code{font:600 17px ui-monospace,Menlo,monospace;letter-spacing:1px}.k small{color:var(--mut)}.ok{color:#1a9a4a}.er{color:#d33}
</style>
</head>
<body>
<div class="w">
  <div class="c">
    <h1>🔑 Gerador de chaves — Fine Gestor</h1>
    <p>Gera chaves no formato <b>PJM-XXXX-XXXX-XX</b>, aceitas pela tela de ativação do programa. Guarde este arquivo só no seu computador e <b>não envie para o GitHub</b>.</p>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:10px">
      <div><label for="qtd">Quantidade</label><input id="qtd" type="number" min="1" max="200" value="1"></div>
      <div><label for="obs">Cliente / observação (opcional)</label><input id="obs" placeholder="Ex.: Maria Silva — pedido 123"></div>
    </div>
    <div class="row"><button class="p" id="gen">Gerar chaves</button><button id="copyAll">Copiar todas</button><button id="csv">Baixar planilha (.csv)</button></div>
  </div>

  <div class="c" id="out" style="display:none"><div id="list"></div></div>

  <div class="c">
    <h1 style="font-size:16px">Conferir uma chave</h1>
    <input id="chk" placeholder="Cole uma chave para verificar" style="text-transform:uppercase">
    <p id="chkR" style="margin:8px 0 0"></p>
  </div>
</div>

<script>
/* Mesma regra de validação do index.html (keyChecksum / validateKey). */
function keyChecksum(body){var s=0;for(var i=0;i<body.length;i++){s=(s*31+body.charCodeAt(i)*7+i)>>>0;}s=s%1296;return s.toString(36).toUpperCase().padStart(2,'0');}
function validateKey(raw){
  var clean=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^PJM[A-Z0-9]{10}$/.test(clean))return false;
  return keyChecksum(clean.slice(3,11))===clean.slice(11,13);
}
var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* sem O, I, 0, 1 para evitar confusão ao digitar */
function rnd(n){var a=new Uint32Array(n),o='';crypto.getRandomValues(a);for(var i=0;i<n;i++)o+=ALPHA[a[i]%ALPHA.length];return o;}
function newKey(){var b=rnd(8),c=keyChecksum(b);return 'PJM-'+b.slice(0,4)+'-'+b.slice(4)+'-'+c;}

var made=[];
function render(){
  var out=document.getElementById('out'),l=document.getElementById('list');
  out.style.display=made.length?'block':'none';
  l.innerHTML=made.map(function(m,i){return '<div class="k"><div><code>'+m.key+'</code><br><small>'+m.date+(m.obs?' · '+m.obs.replace(/</g,'&lt;'):'')+'</small></div><button data-i="'+i+'">Copiar</button></div>';}).join('');
  l.querySelectorAll('button').forEach(function(b){b.onclick=function(){copy(made[+b.dataset.i].key,b);};});
}
function copy(t,btn){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){flash(btn);},function(){
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();flash(btn);});
}
function flash(b){var o=b.textContent;b.textContent='Copiado ✓';setTimeout(function(){b.textContent=o;},1200);}

document.getElementById('gen').onclick=function(){
  var n=Math.max(1,Math.min(200,parseInt(document.getElementById('qtd').value,10)||1)),obs=document.getElementById('obs').value.trim(),d=new Date().toLocaleDateString('pt-BR'),seen={};
  made.forEach(function(m){seen[m.key]=1;});
  var add=[];while(add.length<n){var k=newKey();if(!seen[k]&&validateKey(k)){seen[k]=1;add.push({key:k,obs:obs,date:d});}}
  made=add.concat(made);render();
};
document.getElementById('copyAll').onclick=function(){if(made.length)copy(made.map(function(m){return m.key;}).join('\n'),this);};
document.getElementById('csv').onclick=function(){
  if(!made.length)return;
  var rows=['Chave;Data;Observação'].concat(made.map(function(m){return [m.key,m.date,'"'+m.obs.replace(/"/g,'""')+'"'].join(';');}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='chaves-pjm-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};
document.getElementById('chk').oninput=function(){
  var r=document.getElementById('chkR'),v=this.value.trim();
  if(!v){r.textContent='';return;}
  var ok=validateKey(v);r.className=ok?'ok':'er';r.textContent=ok?'✓ Chave válida':'✗ Chave inválida';
};
</script>
</body>
</html>
