<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5fa;--card:#ffffff;--text:#1b2233;--muted:#667085;--border:#e2e6ef;
  --primary:#2456d6;--primary-ink:#ffffff;
  --green:#157a3d;--green-bg:#e4f5ea;
  --red:#c62828;--red-bg:#fde8e8;
  --orange:#b45309;--orange-bg:#ffefd6;
  --yellow:#7a6100;--yellow-bg:#fff6cc;
  --blue:#1d4ed8;--blue-bg:#e6eeff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420;--card:#171d2c;--text:#e8ecf5;--muted:#93a0b8;--border:#2a3247;
    --primary:#6c93ff;--primary-ink:#0b1020;
    --green:#5fe08e;--green-bg:rgba(34,197,94,.16);
    --red:#ff8f8f;--red-bg:rgba(239,68,68,.18);
    --orange:#fbbf5a;--orange-bg:rgba(245,158,11,.18);
    --yellow:#f6d94c;--yellow-bg:rgba(250,204,21,.14);
    --blue:#8fb2ff;--blue-bg:rgba(96,140,255,.17);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420;--card:#171d2c;--text:#e8ecf5;--muted:#93a0b8;--border:#2a3247;
  --primary:#6c93ff;--primary-ink:#0b1020;
  --green:#5fe08e;--green-bg:rgba(34,197,94,.16);
  --red:#ff8f8f;--red-bg:rgba(239,68,68,.18);
  --orange:#fbbf5a;--orange-bg:rgba(245,158,11,.18);
  --yellow:#f6d94c;--yellow-bg:rgba(250,204,21,.14);
  --blue:#8fb2ff;--blue-bg:rgba(96,140,255,.17);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI","Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.1px}
.brandimg{width:26px;height:26px;border-radius:7px;object-fit:cover;vertical-align:-7px;margin-right:6px}
h2.sec{letter-spacing:.1px}
button{font:inherit;color:inherit}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 20% 10%,#1a2560 0%,#070b22 55%,#050814 100%);}
.gate.hidden{display:none}
.gcard{width:100%;max-width:380px;background:rgba(18,22,48,.9);border:1px solid rgba(120,140,255,.25);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,10,.5);text-align:center;color:#e8ecf8}
.gcard img{width:88px;height:88px;border-radius:18px;object-fit:cover;margin-bottom:12px}
.gcard h2{margin:0 0 4px;font-size:19px;color:#fff}
.gcard p.gsub{margin:0 0 18px;color:#9aa3c9;font-size:13px}
.gcard .fld{text-align:left}
.gcard input{background:rgba(255,255,255,.06);border:1px solid rgba(140,150,220,.3);color:#fff}
.gcard input::placeholder{color:#6b74a0}
.gcard .btn.primary{width:100%;background:linear-gradient(90deg,#3556e6,#9433d6);border:none;padding:11px;font-weight:700;border-radius:12px}
.gcard .gerr{color:#ff8a8a;font-size:13px;min-height:16px;margin:2px 0 10px}
.gcard .glink{background:none;border:none;color:#8fa3ff;font-size:13px;cursor:pointer;margin-top:12px;text-decoration:underline}
.shell{display:flex;min-height:100%}
.side{flex:none;width:216px;background:var(--card);border-right:1px solid var(--border);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:20}
.content{flex:1;min-width:0}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
.icon{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}
.side .icon.sidecfg{width:100%;text-align:left;padding:9px 12px;font-size:14px;font-weight:600;margin-top:auto}
.tabs{display:flex;flex-direction:column;gap:3px}
.tab{border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;text-align:left;width:100%;display:flex;align-items:center;justify-content:flex-start}
.tb{display:inline-block;min-width:18px;margin-left:auto;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-size:11px;line-height:18px;text-align:center}
@media (max-width:720px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;border-right:none;border-bottom:1px solid var(--border);flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .side .brand{flex:none;margin-right:auto}
  .side .icon.sidecfg{width:auto;margin-top:0;order:1}
  .tabs{flex-direction:row;overflow-x:auto;width:100%;order:2;gap:6px}
  .tab{width:auto;border-radius:999px;flex:none}
  .tb{margin-left:6px}
}
.tab.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bg)}
.tb.red{background:var(--red);color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h2.sec{font-size:16px;margin:22px 0 10px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--border);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.banner.bad{background:var(--red-bg);color:var(--red);border-color:transparent}
.banner.warn{background:var(--orange-bg);color:var(--orange);border-color:transparent}
.banner.info{background:var(--yellow-bg);color:var(--yellow);border-color:transparent}
.banner b{font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card .lb{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .vl{font-size:24px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.vl.pos{color:var(--green)}.vl.neg{color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.out i{background:var(--primary)}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.monthnav .mlabel{font-weight:800;font-size:18px;min-width:170px;text-align:center}
.btn{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 1fr auto auto auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:14px;padding:10px 12px}
.row.st-late{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),var(--card) 40%)}
.row.st-today{border-left-color:var(--orange);background:linear-gradient(90deg,var(--orange-bg),var(--card) 40%)}
.row.st-soon{border-left-color:var(--yellow)}
.row.st-paid{border-left-color:var(--green)}
.row.st-pending{border-left-color:var(--blue)}
.dt{text-align:center;line-height:1.1}.dt b{font-size:20px;display:block}.dt small{color:var(--muted);text-transform:uppercase;font-size:11px}
.nm{font-weight:700}.sub{font-size:13px;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap}.amt.in{color:var(--green)}.amt.out{color:var(--text)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-paid.pill{background:var(--green-bg);color:var(--green)}
.st-late.pill{background:var(--red);color:#fff}
.st-today.pill{background:var(--orange-bg);color:var(--orange);outline:1px solid var(--orange)}
.st-soon.pill{background:var(--yellow-bg);color:var(--yellow)}
.st-pending.pill{background:var(--blue-bg);color:var(--blue)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.fchip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.fchip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.empty{border:1px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);font-weight:700;margin-left:6px;vertical-align:middle}
.icard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.icard .top2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.icard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.icard .parcelas{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;font-weight:600}
.fld small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(5,10,25,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.mh h3{margin:0;font-size:17px}
.mb{padding:14px 16px;overflow:auto}
.setblock{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.setblock h4{margin:0 0 10px;font-size:14px}
.setblock:last-child{margin-bottom:0}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#main>.card+.card{margin-top:12px}
.mb h4{margin:16px 0 6px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.err{color:var(--red);font-weight:600;margin-bottom:8px}.err:empty{display:none}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 12px}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;font-size:14px}
.toast.warn{background:var(--orange);color:#fff}
.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{min-height:64px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cell.other{opacity:.45}
.cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cell.sel{background:var(--blue-bg)}
.cell.hasLate{border-color:var(--red)}
.cell .dn{font-size:12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:2px}
.chip{display:flex;align-items:center;gap:4px;font-size:11px;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:600}
.chip .t{display:none;overflow:hidden;text-overflow:ellipsis}
.chip.st-paid{background:var(--green-bg);color:var(--green)}
.chip.st-late{background:var(--red);color:#fff}
.chip.st-today{background:var(--orange-bg);color:var(--orange);outline:1px solid var(--orange)}
.chip.st-soon{background:var(--yellow-bg);color:var(--yellow)}
.chip.st-pending{background:var(--blue-bg);color:var(--blue)}
.more{font-size:11px;color:var(--muted);font-weight:700}
@media (min-width:641px){
  .cell{min-height:98px}
  .chips{flex-direction:column;flex-wrap:nowrap}
  .chip .t{display:inline}
}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:12px;align-items:center}
.nrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.nrow.unread{border-color:var(--primary);background:var(--blue-bg)}
.ni{font-size:22px;text-align:center}
.ntime{font-size:12px;color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .chip.st-late,.pill.st-late{animation:pulse 1.8s infinite}
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}70%{box-shadow:0 0 0 6px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
@media (max-width:640px){
  .row{grid-template-columns:48px 1fr auto}
  .row .stat{grid-column:2}
  .row .act{grid-column:3;justify-self:end}
  .grid2{grid-template-columns:1fr}
  .setgrid{grid-template-columns:1fr}
  input,select,textarea{font-size:16px}
  .monthnav .mlabel{min-width:0;flex:1}
}

.rbars{display:flex;flex-direction:column;gap:8px}.rb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.rb i{display:block;height:12px;border-radius:6px;background:var(--primary)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi small{color:var(--muted);display:block}.kpi b{font-size:18px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;color:#fff;background:var(--primary);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
@media print{#tabs,.noprint,.btn,header,#stor{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>

function $(s,r){return (r||document).querySelector(s);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayISO(){return iso(new Date());}
function addMonths(s,n){var p=s.split('-').map(Number);var t=new Date(p[0],p[1]-1+n,1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(p[2],last)));}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d);}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/86400000);}
function fmtDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtNum(v){return Number(v).toFixed(2).replace('.',',');}
function toNum(s){if(typeof s==='number')return s;s=String(s).trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function plural(n,a,b){return n+' '+(n===1?a:b);}
function fmtTs(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function monthRange(ym){var p=ym.split('-').map(Number);var last=new Date(p[0],p[1],0).getDate();return [ym+'-01',ym+'-'+pad(last)];}
function fld(l,i,h){return '<label class="fld"><span>'+l+'</span>'+i+(h?'<small>'+h+'</small>':'')+'</label>';}

function defaults(){return {incomes:[],receipts:[],bills:[],payments:[],notifs:[],savings:[],savingsTx:[],accounts:[],accountTx:[],cats:[],cards:[],cardTx:[],cardPaid:[],tickets:[],lastAlertDay:'',settings:{alertDays:5,theme:'auto',browserNotif:false,lastBackup:'',activated:false,licenseKey:'',pinHash:''},budgets:{divida:0,contrato:0,plano:0,fixa:0,pontual:0}};}
var db=defaults();
var storageOK=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);var b=defaults();db=Object.assign(b,d);db.settings=Object.assign(defaults().settings,d.settings||{});db.budgets=Object.assign(defaults().budgets,d.budgets||{});}
  }catch(e){storageOK=false;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;}}

function listOf(k){return k==='in'?db.incomes:db.bills;}
function recsOf(k){return k==='in'?db.receipts:db.payments;}
function keyOf(k){return k==='in'?'incomeId':'billId';}
function findItem(k,id){return listOf(k).find(function(x){return x.id===id;});}
function recMap(k,id){var m=new Map();recsOf(k).forEach(function(r){if(r[keyOf(k)]===id)m.set(r.n,r);});return m;}
function occDateAt(it,n){return it.recorrencia==='mensal'?addMonths(it.data,n-1):it.data;}
function maxN(it){return it.recorrencia==='mensal'?(it.parcelas>0?it.parcelas:600):1;}
function statusOf(d,rec){
  if(rec)return 'paid';
  var df=diffDays(d,todayISO());
  if(df<0)return 'late';
  if(df===0)return 'today';
  if(df<=db.settings.alertDays)return 'soon';
  return 'pending';
}
function statusText(o){
  var df=diffDays(o.date,todayISO());var inn=o.kind==='in';
  switch(o.status){
    case 'paid':return inn?'Recebido':'Pago';
    case 'late':return 'Atrasado há '+plural(-df,'dia','dias');
    case 'today':return inn?'Recebe hoje':'Vence hoje';
    case 'soon':return df===1?'Amanhã':'Em '+df+' dias';
    default:return inn?'A receber':'A pagar';
  }
}
function occFor(k,it,upTo){
  var rs=recMap(k,it.id);var out=[];var mx=maxN(it);
  for(var n=1;n<=mx;n++){
    var d=occDateAt(it,n);
    if(d>upTo)break;
    if(it.encerradaEm&&d>it.encerradaEm)break;
    var rec=rs.get(n);
    out.push({kind:k,item:it,n:n,date:d,rec:rec,status:statusOf(d,rec)});
  }
  return out;
}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.item.nome<b.item.nome?-1:1);}
function buildOcc(k,upTo){
  var out=[];
  listOf(k).forEach(function(it){out=out.concat(occFor(k,it,upTo));});
  if(k==='out')out=out.concat(cdOcc(upTo));
  return out.sort(byDate);
}
function nextOcc(k,it){
  var rs=recMap(k,it.id);var mx=maxN(it);
  for(var n=1;n<=mx;n++){
    var d=occDateAt(it,n);
    if(it.encerradaEm&&d>it.encerradaEm)return null;
    if(!rs.has(n))return {kind:k,item:it,n:n,date:d,rec:null,status:statusOf(d,null)};
  }
  return null;
}
function itemStats(k,it){
  var rs=recsOf(k).filter(function(r){return r[keyOf(k)]===it.id;});
  var paidCount=rs.length;
  var paidSum=rs.reduce(function(s,r){return s+Number(r.valor);},0);
  var finite=it.recorrencia!=='mensal'||it.parcelas>0||!!it.encerrada;
  var total=finite?occFor(k,it,'9999-12-31').length:null;
  var done=!!it.encerrada||(total!==null&&paidCount>=total);
  var remaining=total!==null?Math.max(0,total-paidCount)*Number(it.valor):null;
  return {paidCount:paidCount,paidSum:paidSum,total:total,done:done,remaining:remaining};
}
function doneLabel(k,it){
  if(it.encerrada)return 'Encerrada';
  if(it.recorrencia!=='mensal')return k==='in'?'Concretizado':'Concretizada';
  return k==='in'?'Finalizado':'Quitada';
}
function alertSummary(){
  var up=addDays(todayISO(),db.settings.alertDays);
  var all=buildOcc('in',up).concat(buildOcc('out',up)).filter(function(o){return !o.rec;}).sort(byDate);
  return {
    late:all.filter(function(o){return o.status==='late';}),
    today:all.filter(function(o){return o.status==='today';}),
    soon:all.filter(function(o){return o.status==='soon';})
  };
}

/* ---------- notificações ---------- */
function toast(msg,type){
  var el=document.createElement('div');el.className='toast'+(type==='alerta'?' warn':'');el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(function(){el.remove();},4200);
}
function notify(type,title,text,quiet){
  db.notifs.unshift({id:uid(),ts:Date.now(),type:type,title:title,text:text||'',read:false});
  if(db.notifs.length>300)db.notifs.length=300;
  if(!quiet)toast(title+(text?' — '+text:''),type);
}
function browserNotify(title,body){
  try{if(db.settings.browserNotif&&'Notification' in window&&Notification.permission==='granted'){new Notification(title,{body:body});}}catch(e){}
}
function dailyAlert(){
  var t=todayISO();
  if(db.lastAlertDay===t)return;
  db.lastAlertDay=t;
  var s=alertSummary();
  var n=s.late.length+s.today.length+s.soon.length;
  if(n>0){
    var parts=[];
    if(s.late.length)parts.push(plural(s.late.length,'em atraso','em atraso'));
    if(s.today.length)parts.push(s.today.length+' para hoje');
    if(s.soon.length)parts.push(s.soon.length+' nos próximos '+db.settings.alertDays+' dias');
    var txt=parts.join(' · ');
    notify('alerta','Resumo de vencimentos e recebimentos',txt,true);
    browserNotify('PJM Finanças',txt);
  }
  save();
}

  closeModal();

  overlay.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="mh"><h3></h3><button class="icon" data-close aria-label="Fechar">✕</button></div><div class="mb"></div><div class="mf"></div></div>';
  $('h3',overlay).textContent=title;
  $('.mb',overlay).innerHTML=body;
  var mf=$('.mf',overlay);
  (actions||[{label:'Fechar'}]).forEach(function(a){
    var b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;
    b.addEventListener('click',function(){if(a.fn&&a.fn()===false)return;closeModal();});
    mf.appendChild(b);
  });
  overlay.addEventListener('click',function(e){if(e.target===overlay||(e.target.hasAttribute&&e.target.hasAttribute('data-close')))closeModal();});
  document.body.appendChild(overlay);
  if(onOpen)onOpen(overlay);

function calcSimples(){var c=toNum($('#c_si_cap').value)||0,i=(toNum($('#c_si_tax').value)||0)/100,t=toNum($('#c_si_tempo').value)||0;var j=c*i*t,m=c+j;$('#c_si_out').innerHTML='<div class="lb">Juros no período</div><div class="vl">'+brl(j)+'</div><div class="sub">Montante final: <b>'+brl(m)+'</b></div>';}
function calcCompostos(){var c=toNum($('#c_ci_cap').value)||0,i=(toNum($('#c_ci_tax').value)||0)/100,t=toNum($('#c_ci_tempo').value)||0;var m=c*Math.pow(1+i,t),j=m-c;$('#c_ci_out').innerHTML='<div class="lb">Montante final</div><div class="vl">'+brl(m)+'</div><div class="sub">Juros no período: <b>'+brl(j)+'</b></div>';}
function calcParcela(){
  var pv=toNum($('#c_pc_valor').value)||0,i=(toNum($('#c_pc_tax').value)||0)/100,n=toNum($('#c_pc_n').value)||0;
  var pmt=0;if(n>0)pmt=i>0?pv*i/(1-Math.pow(1+i,-n)):pv/n;
  var total=pmt*n,jt=total-pv;
  $('#c_pc_out').innerHTML='<div class="lb">Valor de cada parcela</div><div class="vl">'+brl(pmt)+'</div><div class="sub">Total pago: <b>'+brl(total)+'</b> · Total de juros: <b>'+brl(jt)+'</b></div>';
}
function calcPorcento(){
  var v=toNum($('#c_pt_valor').value)||0,p=toNum($('#c_pt_perc').value)||0,op=$('#c_pt_op').value,r,label;

  else{r=v*p/100;label='Resultado';}
  $('#c_pt_out').innerHTML='<div class="lb">'+label+'</div><div class="vl">'+brl(r)+'</div>';
}

var cdMonth=todayISO().slice(0,7);

function cdInst(c){var o=[];db.cardTx.filter(function(t){return t.cardId===c.id;}).forEach(function(t){var b=cdInvYM(c,t.data),n=t.parcelas||1;for(var i=1;i<=n;i++)o.push({tx:t,i:i,n:n,ym:ymAdd(b,i-1),v:t.valor/n});});return o;}
function cdDue(c,ym){return (c.venc>c.fech?ym:ymAdd(ym,1))+'-'+pad(c.venc);}
function cdPaidOf(c,ym){return db.cardPaid.find(function(p){return p.cardId===c.id&&p.ym===ym;});}
function cdOcc(upTo){
  var out=[];
  db.cards.forEach(function(c){var by={};
    cdInst(c).forEach(function(x){by[x.ym]=(by[x.ym]||0)+x.v;});
    Object.keys(by).forEach(function(ym){
      var d=cdDue(c,ym);if(d>upTo)return;
      var pd=cdPaidOf(c,ym),rec=pd?{id:pd.id,valor:pd.valor,dataReal:pd.data,n:1}:undefined;
      out.push({kind:'out',item:{id:'card:'+c.id+':'+ym,nome:'Fatura '+c.nome,valor:by[ym],categoria:'Cartão de crédito',recorrencia:'unica',card:true,cardId:c.id,ym:ym},n:1,date:d,rec:rec,status:statusOf(d,rec)});
    });
  });
  return out;
}

var SR={q:'',k:'',st:'',a:'',b:''};
function srRows(){
  var up=addDays(todayISO(),365),q=SR.q.toLowerCase(),occ=[];
  if(SR.k!=='card'){if(SR.k!=='out')occ=occ.concat(buildOcc('in',up));if(SR.k!=='in')occ=occ.concat(buildOcc('out',up));}
  occ=occ.filter(function(o){var it=o.item,t=[it.nome,it.parte,it.obs,BILL_CATS[it.categoria]||it.categoria||'',IN_TYPES[it.tipo]||''].join(' ').toLowerCase();
    if(q&&t.indexOf(q)<0)return false;
    if(SR.st&&(SR.st==='paid'?!o.rec:(o.rec||o.status!==SR.st)))return false;
    if(SR.a&&o.date<SR.a)return false;if(SR.b&&o.date>SR.b)return false;return true;
  }).sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0;});
  var tin=0,tout=0;occ.forEach(function(o){var v=Number(o.rec?o.rec.valor:o.item.valor);if(o.kind==='in')tin+=v;else tout+=v;});
  var cx=(!SR.st&&(SR.k===''||SR.k==='card'))?db.cardTx.filter(function(t){var c=db.cards.find(function(x){return x.id===t.cardId;});
    return (!q||(t.desc+' '+(c?c.nome:'')).toLowerCase().indexOf(q)>=0)&&(!SR.a||t.data>=SR.a)&&(!SR.b||t.data<=SR.b);}).sort(function(x,y){return x.data<y.data?1:-1;}):[];
  var n=occ.length+cx.length;if(!n)return '<div class="empty">Nada encontrado com esses filtros.</div>';
  return '<p class="small muted">'+plural(n,'resultado','resultados')+' · entradas '+brl(tin)+' · saídas '+brl(tout)+(cx.length?' · '+cx.length+' no cartão':'')+'</p><div class="list">'+
    occ.slice(0,150).map(occRow).join('')+cx.slice(0,50).map(function(t){var c=db.cards.find(function(x){return x.id===t.cardId;});
      return '<div class="row"><div class="info"><div class="nm">💳 '+esc(t.desc)+'</div><div class="sub">'+esc(c?c.nome:'Cartão')+' · '+fmtDate(t.data)+(t.parcelas>1?' · '+t.parcelas+'x':'')+'</div></div><div class="amt out">− '+brl(t.valor)+'</div></div>';}).join('')+'</div>';

function viewPainel(){
  var r=monthRange(ui.month);var s=r[0],e=r[1];
  var ins=buildOcc('in',e).filter(function(o){return o.date>=s;});
  var outs=buildOcc('out',e).filter(function(o){return o.date>=s;});
  var val=function(o){return o.rec?Number(o.rec.valor):Number(o.item.valor);};
  var sum=function(a,f){return a.filter(f).reduce(function(t,o){return t+val(o);},0);};
  var inPrev=sum(ins,function(){return true;}),inRec=sum(ins,function(o){return o.rec;});
  var outPrev=sum(outs,function(){return true;}),outPaid=sum(outs,function(o){return o.rec;});
  var pI=inPrev?Math.round(inRec/inPrev*100):0,pO=outPrev?Math.round(outPaid/outPrev*100):0;
  var t=todayISO();
  var up=buildOcc('in',addDays(t,30)).concat(buildOcc('out',addDays(t,30))).filter(function(o){return !o.rec;}).sort(byDate).slice(0,12);
  var h='';
  if(!db.incomes.length&&!db.bills.length){
    h+='<div class="card" style="margin-bottom:14px"><h2 class="sec" style="margin-top:0">Bem-vindo! 👋</h2><p class="muted">Comece cadastrando o que você recebe e o que você paga. O painel, o calendário e os alertas se montam sozinhos.</p><div class="btnrow"><button class="btn primary" onclick="app.newItem(\'in\')">+ Cadastrar entrada</button><button class="btn primary" onclick="app.newItem(\'out\')">+ Cadastrar conta</button><button class="btn" onclick="app.sample()">Ver com dados de exemplo</button></div></div>';
  }
  h+=alertBanner()+backupBanner()+monthNav();
  h+='<div class="cards">'+
    '<div class="card"><div class="lb">Entradas do mês</div><div class="vl">'+brl(inPrev)+'</div><div class="sub">Recebido '+brl(inRec)+' · falta '+brl(inPrev-inRec)+'</div><div class="bar"><i style="width:'+pI+'%"></i></div></div>'+
    '<div class="card"><div class="lb">Saídas do mês</div><div class="vl">'+brl(outPrev)+'</div><div class="sub">Pago '+brl(outPaid)+' · falta '+brl(outPrev-outPaid)+'</div><div class="bar out"><i style="width:'+pO+'%"></i></div></div>'+
    '<div class="card"><div class="lb">Saldo previsto</div><div class="vl '+(inPrev-outPrev>=0?'pos':'neg')+'">'+brl(inPrev-outPrev)+'</div><div class="sub">Entradas − saídas do mês</div></div>'+
    '<div class="card"><div class="lb">Saldo realizado</div><div class="vl '+(inRec-outPaid>=0?'pos':'neg')+'">'+brl(inRec-outPaid)+'</div><div class="sub">Já recebido − já pago</div></div>'+
    '</div>';
  if(db.incomes.length||db.bills.length){
    h+='<h2 class="sec">Evolução (últimos 6 meses)</h2><div class="card">'+evoChart()+'<div class="sub" style="margin-top:6px">🟢 Entradas recebidas · 🔴 Saídas pagas</div></div>';
  }
  if(db.savings.length){
    h+='<h2 class="sec">Poupança</h2><div class="cards"><div class="card"><div class="lb">Total guardado</div><div class="vl pos">'+brl(svTotal())+'</div><div class="sub">Somando '+plural(db.savings.length,'poupança','poupanças')+'</div></div></div>';
  }
  h+='<h2 class="sec">Próximos vencimentos e recebimentos (30 dias)</h2>';
  h+=up.length?'<div class="list">'+up.map(occRow).join('')+'</div>':'<div class="empty">Nada pendente nos próximos 30 dias.</div>';
  h+='<h2 class="sec">Lançamentos de '+MESES[Number(ui.month.split('-')[1])-1]+'</h2>';
  var all=ins.concat(outs).sort(byDate);
  h+=all.length?'<div class="list">'+all.map(occRow).join('')+'</div>':'<div class="empty">Sem lançamentos neste mês.</div>';
  return h;
}

function viewCal(){
  var p=ui.month.split('-').map(Number);
  var first=new Date(p[0],p[1]-1,1);
  var gsI=iso(new Date(p[0],p[1]-1,1-first.getDay()));
  var geI=addDays(gsI,41);
  var occ=buildOcc('in',geI).concat(buildOcc('out',geI)).filter(function(o){return o.date>=gsI;});
  var by={};occ.forEach(function(o){(by[o.date]=by[o.date]||[]).push(o);});
  var t=todayISO();
  var cells='';
  DOW.forEach(function(d){cells+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<42;i++){
    var d=addDays(gsI,i);var dn=parseD(d);var list=by[d]||[];
    var other=d.slice(0,7)!==ui.month;
    var late=list.some(function(o){return o.status==='late';});
    var chips=list.slice(0,3).map(function(o){
      return '<span class="chip st-'+o.status+'" title="'+esc(o.item.nome)+' · '+brl(o.item.valor)+'"><span>'+(o.kind==='in'?'▲':'▼')+'</span><span class="t">'+esc(o.item.nome)+'</span></span>';
    }).join('')+(list.length>3?'<span class="more">+'+(list.length-3)+'</span>':'');
    cells+='<button class="cell'+(other?' other':'')+(d===t?' today':'')+(d===ui.selDay?' sel':'')+(late?' hasLate':'')+'" onclick="app.selectDay(\''+d+'\')"><span class="dn">'+dn.getDate()+'</span><span class="chips">'+chips+'</span></button>';
  }
  var h=monthNav()+'<div class="cal">'+cells+'</div>';
  h+='<div class="legend"><b>Legenda:</b> <span>▲ entrada</span> <span>▼ saída</span> <span class="pill st-paid">Pago/Recebido</span> <span class="pill st-pending">Pendente</span> <span class="pill st-soon">Vence em breve</span> <span class="pill st-today">Hoje</span> <span class="pill st-late">Atrasado</span></div>';
  var sel=buildOcc('in',ui.selDay).concat(buildOcc('out',ui.selDay)).filter(function(o){return o.date===ui.selDay;});
  var sd=parseD(ui.selDay);
  var tin=sel.filter(function(o){return o.kind==='in';}).reduce(function(s,o){return s+Number(o.item.valor);},0);
  var tout=sel.filter(function(o){return o.kind==='out';}).reduce(function(s,o){return s+Number(o.item.valor);},0);
  h+='<div class="sechead"><h2 class="sec">'+DOWF[sd.getDay()]+', '+sd.getDate()+' de '+MESES[sd.getMonth()].toLowerCase()+' de '+sd.getFullYear()+'</h2><div class="btnrow"><button class="btn sm" onclick="app.newItem(\'in\',{data:\''+ui.selDay+'\'})">+ Entrada neste dia</button><button class="btn sm" onclick="app.newItem(\'out\',{data:\''+ui.selDay+'\'})">+ Conta neste dia</button></div></div>';
  if(sel.length){
    h+='<div class="sub" style="margin-bottom:8px">A receber: <b>'+brl(tin)+'</b> · A pagar: <b>'+brl(tout)+'</b></div><div class="list">'+sel.map(occRow).join('')+'</div>';
  }else h+='<div class="empty">Nenhum recebimento ou pagamento marcado neste dia.</div>';
  return h;
}

function saveFile(name,data,cb){

function last6Months(){

    var outs=buildOcc('out',r[1]).filter(function(o){return o.date>=r[0]&&o.rec;}).reduce(function(s,o){return s+Number(o.rec.valor);},0);
    out.push({ym:ym,ins:ins,outs:outs});

function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return String(h);}
function keyChecksum(body){var s=0;for(var i=0;i<body.length;i++){s=(s*31+body.charCodeAt(i)*7+i)>>>0;}s=s%1296;return s.toString(36).toUpperCase().padStart(2,'0');}
function validateKey(raw){
  var clean=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^PJM[A-Z0-9]{10}$/.test(clean))return false;
  var body=clean.slice(3,11),cc=clean.slice(11,13);
  return keyChecksum(body)===cc;
}

/* ---------- importar extrato bancário ---------- */
function parseCsvDate(s){
  s=(s||'').trim();var m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/)))return '20'+m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}
function parseStatementCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(!lines.length)return [];
  var delim=lines[0].indexOf(';')>-1?';':',';
  function split(l){
    var out=[],cur='',q=false;
    for(var i=0;i<l.length;i++){var c=l[i];
      if(c==='"'){q=!q;continue;}
      if(c===delim&&!q){out.push(cur);cur='';continue;}
      cur+=c;
    }
    out.push(cur);return out.map(function(s){return s.trim().replace(/^"|"$/g,'');});
  }
  var rows=lines.map(split);
  var head=rows[0].map(function(s){return s.toLowerCase();});
  var di=head.findIndex(function(h){return /data|date/.test(h);});
  var vi=head.findIndex(function(h){return /valor|amount|value/.test(h);});
  var ci=head.findIndex(function(h){return /desc|hist|memo|lan[çc]amento/.test(h);});
  var start=(di>=0||vi>=0)?1:0;
  if(di<0)di=0;if(vi<0)vi=rows[0].length-1;
  var out=[];
  for(var r=start;r<rows.length;r++){
    var row=rows[r];if(row.length<2)continue;
    var d=parseCsvDate(row[di]);var v=toNum(row[vi]);
    var desc=ci>=0?row[ci]:row.filter(function(_,i){return i!==di&&i!==vi;}).join(' ');
    if(!d||isNaN(v)||v===0)continue;
    out.push({date:d,valor:Math.abs(v),sinal:v<0?-1:1,desc:desc||''});
  }
  return out;
}
function parseStatementOFX(text){
  var out=[],re=/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi,m;
  function tag(b,t){var x=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return x?x[1].trim():'';}
  while((m=re.exec(text))){
    var b=m[1],dt=tag(b,'DTPOSTED'),v=parseFloat(tag(b,'TRNAMT').replace(',','.'));
    if(dt.length<8||isNaN(v)||v===0)continue;
    out.push({date:dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8),valor:Math.abs(v),sinal:v<0?-1:1,desc:tag(b,'MEMO')||tag(b,'NAME')});
  }
  return out;
}
function normName(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function nameScore(a,b){
  var aw=normName(a).split(' ').filter(Boolean),bw=normName(b).split(' ').filter(Boolean);
  if(!aw.length||!bw.length)return 0;
  var hit=0;aw.forEach(function(w){if(bw.indexOf(w)>-1)hit++;});
  return hit/aw.length;
}
function matchStatement(txs){
  var upTo=addDays(todayISO(),120);
  var pend=buildOcc('in',upTo).concat(buildOcc('out',upTo)).filter(function(o){return !o.rec&&!o.item.card;});
  var out=[];
  txs.forEach(function(t){
    var best=null,bs=-1;
    pend.forEach(function(o){
      var dd=Math.abs(diffDays(o.date,t.date));if(dd>7)return;
      var vv=Math.abs(Number(o.item.valor)-t.valor);if(vv>Math.max(0.02,t.valor*0.02))return;
      var sc=nameScore(t.desc,o.item.nome)+(o.kind==='in'&&t.sinal>=0?.2:0)+(o.kind==='out'&&t.sinal<0?.2:0)-dd*0.02;
      if(sc>bs){bs=sc;best=o;}
    });
    if(best&&bs>0)out.push({tx:t,match:best,score:bs});
  });
  var seen={};
  return out.sort(function(a,b){return b.score-a.score;}).filter(function(m){
    var k=m.match.kind+m.match.item.id+m.match.n;if(seen[k])return false;seen[k]=1;return true;
  });
}

    db.settings.theme=$('#s_theme').value;
    var want=!!($('#s_bn')&&$('#s_bn').checked);
    db.settings.browserNotif=want;
    var pv=$('#s_pin').value;
    if(pv==='REMOVER')db.settings.pinHash='';
    else if(pv)db.settings.pinHash=simpleHash(pv);
    Object.keys(BILL_CATS).forEach(function(k){var v=toNum($('#bg_'+k).value);db.budgets[k]=(v>0)?v:0;});
    if(want){
      try{Notification.requestPermission().then(function(p){if(p!=='granted'){db.settings.browserNotif=false;save();toast('O navegador não liberou os avisos.','alerta');}});}
      catch(e){db.settings.browserNotif=false;}
    }
    save();applyTheme();render();
  }}],function(root){
    $('#b_json',root).addEventListener('click',exportJSON);
    $('#b_csv',root).addEventListener('click',exportCSV);
    $('#b_ics',root).addEventListener('click',exportICS);$('#b_db',root).addEventListener('click',exportForDB);$('#b_tut',root).addEventListener('click',function(){closeModal();onboard();});$('#b_terms',root).addEventListener('click',function(){legalModal('t');});$('#b_priv',root).addEventListener('click',function(){legalModal('p');});
    $('#b_stmt',root).addEventListener('click',function(){closeModal();importStatementModal();});
    $('#b_sample',root).addEventListener('click',function(){closeModal();loadSample();});
    $('#b_clear',root).addEventListener('click',function(){
      confirmBox('Apagar tudo','Isso apaga todos os cadastros, pagamentos, recebimentos e avisos deste navegador. Faça um backup antes, se quiser guardar.','Apagar tudo',function(){
        db=defaults();save();applyTheme();ui.expanded={};render();toast('Dados apagados.');
      },true);
    });
    $('#b_file',root).addEventListener('change',function(ev){
      var f=ev.target.files&&ev.target.files[0];if(!f)return;
      f.text().then(function(txt){
        confirmBox('Importar backup','Substituir os dados atuais pelos do arquivo <b>'+esc(f.name)+'</b>?','Importar',function(){importData(txt);});
      });
    });
  });
}

/* ---------- API pública usada pelos botões ---------- */
window.app={
  tryActivate:function(){
    var k=($('#g_key')||{}).value||'';
    if(!validateKey(k)){renderActivation('Chave inválida. Confira e tente novamente.');return;}
    db.settings.activated=true;db.settings.licenseKey=k.toUpperCase();save();
    renderSetPin();
  },
  finishSetup:function(){
    var p=($('#g_pin')||{}).value||'';
    db.settings.pinHash=p?simpleHash(p):'';save();
    startApp();
  },
  tryUnlock:function(){
    var p=($('#g_pin2')||{}).value||'';
    if(simpleHash(p)!==db.settings.pinHash){renderLock('Senha incorreta.');return;}
    startApp();
  },
  forgotPin:function(){
    confirmBox('Esqueceu a senha?','Como não há servidor, não é possível recuperar a senha. Você pode remover a senha de acesso deste computador (os dados continuam aqui), digitando sua chave de ativação de novo para confirmar.','Remover senha',function(){
      renderActivation();
    });
  },
  supOpen:supOpen,supToggle:supToggle,supDel:supDel,
  calcTab:function(t){ui.calcTab=t;render();},
  newSavings:function(){svForm();},svEdit:function(id){svForm(id);},svMove:svMoveModal,svDel:svDelete,svDelTx:svDeleteTx,
  svToggle:function(id){ui.svExpanded[id]=!ui.svExpanded[id];render();},
  relMon:function(n){ui.month=ymAdd(ui.month,n);render();},
  newAcc:function(){acForm();},acMove:acMove,acDel:acDelete,
  newCard:function(){cdForm();},cdBuy:cdBuy,cdEditCard:function(i){cdForm(i);},acRename:acRename,quick:quickExpense,cdPay:cdPay,cdUnpay:cdUnpay,cdDelTx:cdDelTx,cdDelCard:cdDelCard,cdMon:function(n){cdMonth=ymAdd(cdMonth,n);render();},
  srch:srchUpdate,
  go:function(t){ui.tab=t;render();window.scrollTo(0,0);},
  shiftMonth:function(n){
    var p=ui.month.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);
    ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);
    ui.selDay=ui.month===todayISO().slice(0,7)?todayISO():ui.month+'-01';
    render();
  },
  thisMonth:function(){ui.month=todayISO().slice(0,7);ui.selDay=todayISO();render();},
  selectDay:function(d){ui.selDay=d;if(d.slice(0,7)!==ui.month)ui.month=d.slice(0,7);render();},
  pay:payModal,undo:undoRec,
  newItem:function(k,preset){itemForm(k,null,preset);},
  edit:function(k,id){itemForm(k,id);},
  del:deleteItem,close:closeItem,reopen:reopenItem,
  toggleExp:function(id){ui.expanded[id]=!ui.expanded[id];render();},
  setBillTab:function(t){ui.billTab=t;render();},
  setInFilter:function(f){ui.inFilter=f;render();},
  settings:settingsModal,sample:loadSample,
  clearLog:function(){db.notifs=[];save();render();}
};

/* ---------- inicialização ---------- */
load();applyTheme();boot();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
setInterval(function(){if(!$('#gate').classList.contains('hidden'))return;if(todayISO()!==lastDay){lastDay=todayISO();dailyAlert();render();}},60000);
document.addEventListener('visibilitychange',function(){if(!$('#gate').classList.contains('hidden'))return;if(!document.hidden&&todayISO()!==lastDay){lastDay=todayISO();dailyAlert();render();}});
})();
</script>
